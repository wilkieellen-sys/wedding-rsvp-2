<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colin &amp; Ellen — RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#45607B;
    --paper:#FCFBF1;
    --accent:#90A6A3;
    --line: rgba(69,96,123,0.25);
    --muted: rgba(69,96,123,0.62);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% 0%, rgba(69,96,123,0.06), transparent 60%),
      var(--paper);
  }
  .card{
    position:relative;
    width:100%;
    max-width:460px;
    background: var(--paper);
    border:1px solid var(--ink);
    border-radius:2px;
    box-shadow: 0 14px 30px rgba(69,96,123,0.14);
    padding:44px 36px 38px;
    overflow:visible;
  }
  .card::before{
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:5px;
    background:var(--accent);
  }
  .meta-row{
    display:flex;
    justify-content:center;
    align-items:baseline;
    margin:6px 0 26px;
    padding-bottom:14px;
    border-bottom:1px solid var(--ink);
  }
  .meta-row span{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.16em;
    font-weight:600;
  }
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    text-align:center;
    font-size:clamp(32px, 7.5vw, 42px);
    margin:0 0 12px;
    line-height:1.05;
  }
  .kicker{
    text-align:center;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:10.5px;
    font-weight:600;
    color:var(--muted);
    margin:0 0 30px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
  }

  label{
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
    margin-bottom:8px;
    display:block;
  }
  input[type="text"], input[type="email"], textarea{
    width:100%;
    padding:10px 2px;
    border:none;
    border-bottom:1.5px solid var(--line);
    border-radius:0;
    background:transparent;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition: border-color 0.2s ease;
  }
  input:focus, textarea:focus{
    border-bottom-color: var(--accent);
  }
  textarea{ resize:vertical; min-height:60px; }

  /* Step 1: search */
  #searchStep{ display:flex; flex-direction:column; gap:14px; }
  .search-row{ display:flex; gap:10px; align-items:flex-end; }
  .search-field{ flex:1; position:relative; }
  .dropdown{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:var(--paper);
    border:1px solid var(--ink);
    border-top:none;
    max-height:220px;
    overflow-y:auto;
    z-index:20;
    display:none;
    box-shadow: 0 10px 20px rgba(69,96,123,0.14);
  }
  .dropdown.show{ display:block; }
  .dropdown-item{
    padding:10px 14px;
    font-size:14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .dropdown-item:last-child{ border-bottom:none; }
  .dropdown-item:hover, .dropdown-item.active{
    background:var(--ink);
    color:var(--paper);
  }
  .btn-secondary{
    padding:0 20px;
    height:40px;
    border:1px solid var(--ink);
    border-radius:2px;
    background:transparent;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-secondary:hover{ background:var(--ink); color:var(--paper); }
  .match-list{ display:flex; flex-direction:column; gap:8px; }
  .match-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border:1px solid var(--line); border-radius:2px;
    font-size:14px;
  }
  .match-item button{
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:6px 14px;
    border-radius:2px;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-weight:600;
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .match-item button:hover{ background:var(--ink); color:var(--paper); }
  .hint{ font-size:13px; color:var(--muted); text-align:center; margin:2px 0 0; }
  #demoNotice{ display:none; }

  /* Step 2: party form */
  #partyForm{ display:none; flex-direction:column; gap:20px; }
  .back-link{
    align-self:flex-start;
    background:none; border:none; padding:0; margin-bottom:-6px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.1em;
    font-weight:600; color:var(--muted); cursor:pointer;
  }
  .back-link:hover{ color:var(--ink); }
  .party-label{
    font-family:'Fraunces', serif; font-style:italic; font-size:17px;
    text-align:center; margin:0;
  }
  #membersList{ display:flex; flex-direction:column; gap:10px; }
  .member-row{
    border:1px solid var(--line); border-radius:2px; padding:14px 16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .member-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .member-name{ font-weight:600; font-size:14px; }
  .toggle-row{ display:flex; gap:8px; }
  .toggle{
    padding:6px 16px;
    border-radius:2px;
    border:1px solid var(--ink);
    background:transparent;
    font-family:'Work Sans', sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .toggle.selected-yes{
    background: var(--accent);
    border-color:var(--accent);
    color:var(--ink);
  }
  .toggle.selected-no{
    background: var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .dietary-input{ display:none; margin-top:2px; }

  .section-break{
    display:flex; align-items:center; gap:12px; margin:2px 0;
  }
  .section-break .rule{ flex:1; height:0; border-top:1px solid var(--line); }
  .section-break .label{
    font-size:10px; text-transform:uppercase; letter-spacing:0.16em;
    color:var(--muted); white-space:nowrap;
  }

  button[type="submit"]{
    margin-top:4px;
    padding:16px;
    border:none;
    border-radius:2px;
    background:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-weight:700;
    color:var(--paper);
    cursor:pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button[type="submit"]:hover{ background:var(--accent); color:var(--ink); }
  button[type="submit"]:disabled{ opacity:0.55; cursor:not-allowed; }
  .status{ text-align:center; font-size:13px; margin-top:6px; min-height:18px; font-weight:600; }
  .status.success{ color:var(--ink); }
  .status.error{ color:var(--ink); text-decoration:underline; }
  .required-note{ text-align:center; font-size:11px; color:var(--muted); margin-top:-8px; }
</style>
</head>
<body>

<div class="card">
  <div class="meta-row">
    <span>24 · 04 · 2026</span>
  </div>
  <h1>Colin &amp; Ellen</h1>
  <p class="kicker">RSVP by 1 February 2027</p>

  <!-- Step 1: find your invitation -->
  <div id="searchStep">
    <div class="search-row">
      <div class="search-field">
        <label for="searchName">Find your invitation</label>
        <input type="text" id="searchName" placeholder="Type your name" autocomplete="off">
        <div class="dropdown" id="searchDropdown"></div>
      </div>
      <button type="button" class="btn-secondary" id="searchBtn">Find us</button>
    </div>
    <p class="hint" id="demoNotice">Previewing with sample guest data — try searching &ldquo;Taylor&rdquo;.</p>
    <div id="searchResults"></div>
  </div>

  <!-- Step 2: respond for your party -->
  <form id="partyForm">
    <button type="button" class="back-link" id="backBtn">&larr; Search again</button>
    <p class="party-label" id="partyIntro"></p>

    <div id="membersList"></div>

    <div class="section-break">
      <span class="rule"></span>
      <span class="label">Party Details</span>
      <span class="rule"></span>
    </div>

    <div>
      <label for="contactEmail">Contact email</label>
      <input type="email" id="contactEmail" placeholder="jamie@example.com">
    </div>
    <div>
      <label for="songRequest">Song request (one per party)</label>
      <input type="text" id="songRequest" placeholder="A track that'll get you on the dance floor">
    </div>
    <div>
      <label for="message">Message (optional)</label>
      <textarea id="message" placeholder="Say hello to the happy couple"></textarea>
    </div>

    <button type="submit" id="submitBtn">Save our RSVP</button>
    <p class="required-note">We'll only use these details to plan the day.</p>
    <div class="status" id="status"></div>
  </form>
</div>

<script>
  // ---- CONFIGURATION ----
  const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
  const FORM_TYPE = 'fullday';
  // -----------------------

  // Sample data shown until SCRIPT_URL above is connected to a real
  // Google Sheet — lets you preview the post-search screen right away.
  // Search "Taylor" to see it. Remove/ignore once you're live.
  const SAMPLE_GUESTS = [
    { partyId: 'DEMO01', name: 'Jamie Taylor' },
    { partyId: 'DEMO01', name: 'Sam Taylor' },
    { partyId: 'DEMO01', name: 'Robin Taylor' }
  ];
  const SAMPLE_PARTY = {
    result: 'success',
    partyId: 'DEMO01',
    label: 'The Taylors',
    members: [
      { name: 'Jamie Taylor', attending: '', dietary: '' },
      { name: 'Sam Taylor', attending: '', dietary: '' },
      { name: 'Robin Taylor', attending: '', dietary: '' }
    ],
    songRequest: '',
    message: '',
    contactEmail: ''
  };

  function isDemoMode(){
    return SCRIPT_URL.includes('PASTE_YOUR');
  }

  const searchStep = document.getElementById('searchStep');
  const searchName = document.getElementById('searchName');
  const searchBtn = document.getElementById('searchBtn');
  const searchResults = document.getElementById('searchResults');
  const searchDropdown = document.getElementById('searchDropdown');
  const demoNotice = document.getElementById('demoNotice');

  const partyForm = document.getElementById('partyForm');
  const backBtn = document.getElementById('backBtn');
  const partyIntro = document.getElementById('partyIntro');
  const membersList = document.getElementById('membersList');
  const contactEmailInput = document.getElementById('contactEmail');
  const songRequestInput = document.getElementById('songRequest');
  const messageInput = document.getElementById('message');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');

  let currentParty = null;
  let debounceTimer = null;

  if (isDemoMode()) demoNotice.style.display = 'block';

  // ---- live dropdown suggestions as the guest types ----

  searchName.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = searchName.value.trim();
    if (!q){ hideDropdown(); return; }
    debounceTimer = setTimeout(() => fetchSuggestions(q), 200);
  });

  searchName.addEventListener('focus', () => {
    const q = searchName.value.trim();
    if (q) fetchSuggestions(q);
  });

  searchName.addEventListener('blur', () => {
    // slight delay so a click on a dropdown item registers first
    setTimeout(hideDropdown, 150);
  });

  async function fetchSuggestions(q){
    let matches = [];
    if (isDemoMode()){
      matches = SAMPLE_GUESTS.filter(g => g.name.toLowerCase().includes(q.toLowerCase()));
    } else {
      try{
        const url = `${SCRIPT_URL}?action=search&name=${encodeURIComponent(q)}&formType=${FORM_TYPE}`;
        const res = await fetch(url);
        const data = await res.json();
        matches = data.result === 'success' ? data.matches : [];
      } catch(err){
        matches = [];
      }
    }
    if (searchName.value.trim() !== q) return; // input changed while we were fetching
    renderDropdown(matches);
  }

  function renderDropdown(matches){
    searchDropdown.innerHTML = '';
    if (!matches.length){
      hideDropdown();
      return;
    }
    matches.slice(0, 8).forEach(m => {
      const item = document.createElement('div');
      item.className = 'dropdown-item';
      item.textContent = m.name;
      item.addEventListener('mousedown', (e) => {
        e.preventDefault(); // fire before the input's blur handler
        searchName.value = m.name;
        hideDropdown();
        searchResults.innerHTML = '';
        loadParty(m.partyId);
      });
      searchDropdown.appendChild(item);
    });
    searchDropdown.classList.add('show');
  }

  function hideDropdown(){
    searchDropdown.classList.remove('show');
    searchDropdown.innerHTML = '';
  }

  // ---- explicit "Find us" search (also used as a fallback for Enter) ----

  searchBtn.addEventListener('click', doSearch);
  searchName.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); doSearch(); }});

  async function doSearch(){
    hideDropdown();
    const q = searchName.value.trim();
    searchResults.innerHTML = '';
    if (!q){
      searchResults.innerHTML = '<p class="hint">Type your name to search.</p>';
      return;
    }

    if (isDemoMode()){
      const matches = SAMPLE_GUESTS.filter(g => g.name.toLowerCase().includes(q.toLowerCase()));
      if (!matches.length){
        searchResults.innerHTML = '<p class="hint">No sample guest matches that name — try searching &ldquo;Taylor&rdquo; to preview the demo party.</p>';
        return;
      }
      if (matches.length === 1){
        loadParty(matches[0].partyId);
      } else {
        renderMatches(matches);
      }
      return;
    }

    searchResults.innerHTML = '<p class="hint">Searching...</p>';
    try{
      const url = `${SCRIPT_URL}?action=search&name=${encodeURIComponent(q)}&formType=${FORM_TYPE}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.result === 'success' && data.matches.length){
        if (data.matches.length === 1){
          loadParty(data.matches[0].partyId);
        } else {
          renderMatches(data.matches);
        }
      } else {
        searchResults.innerHTML = "<p class=\"hint\">We couldn't find that name — try a different spelling, or contact the couple directly.</p>";
      }
    } catch(err){
      searchResults.innerHTML = '<p class="hint">Something went wrong — please try again.</p>';
    }
  }

  function renderMatches(matches){
    const list = document.createElement('div');
    list.className = 'match-list';
    matches.forEach(m => {
      const item = document.createElement('div');
      item.className = 'match-item';
      const label = document.createElement('span');
      label.textContent = m.name;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'This is me';
      btn.addEventListener('click', () => loadParty(m.partyId));
      item.appendChild(label);
      item.appendChild(btn);
      list.appendChild(item);
    });
    searchResults.innerHTML = '';
    searchResults.appendChild(list);
  }

  async function loadParty(partyId){
    searchResults.innerHTML = '<p class="hint">Loading your invitation...</p>';

    if (isDemoMode()){
      if (partyId === SAMPLE_PARTY.partyId){
        currentParty = SAMPLE_PARTY;
        renderPartyForm(SAMPLE_PARTY);
      } else {
        searchResults.innerHTML = '<p class="hint">We could not load that invitation. Please try again.</p>';
      }
      return;
    }

    try{
      const url = `${SCRIPT_URL}?action=party&partyId=${encodeURIComponent(partyId)}&formType=${FORM_TYPE}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.result !== 'success'){
        searchResults.innerHTML = '<p class="hint">We could not load that invitation. Please try again.</p>';
        return;
      }
      currentParty = data;
      renderPartyForm(data);
    } catch(err){
      searchResults.innerHTML = '<p class="hint">Something went wrong — please try again.</p>';
    }
  }

  function buildMemberRow(m){
    const row = document.createElement('div');
    row.className = 'member-row';
    row.dataset.name = m.name;
    row.dataset.attending = m.attending || '';

    const top = document.createElement('div');
    top.className = 'member-top';
    const nameEl = document.createElement('div');
    nameEl.className = 'member-name';
    nameEl.textContent = m.name;

    const toggles = document.createElement('div');
    toggles.className = 'toggle-row';
    const yesBtn = document.createElement('div');
    yesBtn.className = 'toggle' + (m.attending === 'yes' ? ' selected-yes' : '');
    yesBtn.textContent = 'Yes';
    const noBtn = document.createElement('div');
    noBtn.className = 'toggle' + (m.attending === 'no' ? ' selected-no' : '');
    noBtn.textContent = 'No';
    toggles.appendChild(yesBtn);
    toggles.appendChild(noBtn);

    top.appendChild(nameEl);
    top.appendChild(toggles);
    row.appendChild(top);

    const dietaryInput = document.createElement('input');
    dietaryInput.type = 'text';
    dietaryInput.className = 'dietary-input';
    dietaryInput.placeholder = 'Dietary requirements';
    dietaryInput.value = m.dietary || '';
    dietaryInput.style.display = m.attending === 'yes' ? 'block' : 'none';
    row.appendChild(dietaryInput);

    function setAttend(val){
      row.dataset.attending = val;
      yesBtn.classList.toggle('selected-yes', val === 'yes');
      noBtn.classList.toggle('selected-no', val === 'no');
      dietaryInput.style.display = val === 'yes' ? 'block' : 'none';
    }
    yesBtn.addEventListener('click', () => setAttend('yes'));
    noBtn.addEventListener('click', () => setAttend('no'));

    return row;
  }

  function renderPartyForm(data){
    searchStep.style.display = 'none';
    partyForm.style.display = 'flex';
    statusEl.textContent = '';
    statusEl.className = 'status';
    partyIntro.textContent = data.label ? `Here's who's invited from ${data.label}` : "Here's who's invited";
    membersList.innerHTML = '';
    data.members.forEach(m => membersList.appendChild(buildMemberRow(m)));
    contactEmailInput.value = data.contactEmail || '';
    songRequestInput.value = data.songRequest || '';
    messageInput.value = data.message || '';
  }

  backBtn.addEventListener('click', () => {
    partyForm.style.display = 'none';
    searchStep.style.display = 'flex';
    searchResults.innerHTML = '';
    currentParty = null;
  });

  partyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = '';
    statusEl.className = 'status';

    const rows = [...membersList.querySelectorAll('.member-row')];
    const responses = rows.map(r => ({
      name: r.dataset.name,
      attending: r.dataset.attending || '',
      dietary: r.querySelector('.dietary-input') ? r.querySelector('.dietary-input').value : ''
    }));

    if (responses.some(r => !r.attending)){
      statusEl.textContent = 'Please mark yes or no for everyone in your party.';
      statusEl.className = 'status error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    if (isDemoMode()){
      setTimeout(() => {
        statusEl.textContent = 'Preview saved — connect your Google Sheet to collect real RSVPs.';
        statusEl.className = 'status success';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save our RSVP';
      }, 500);
      return;
    }

    const payload = {
      action: 'submit',
      formType: FORM_TYPE,
      partyId: currentParty.partyId,
      contactEmail: contactEmailInput.value,
      songRequest: songRequestInput.value,
      message: messageInput.value,
      responses: responses
    };

    try{
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.result === 'success'){
        statusEl.textContent = "Thank you — we can't wait to celebrate with you!";
        statusEl.className = 'status success';
      } else {
        statusEl.textContent = 'Something went wrong — please try again.';
        statusEl.className = 'status error';
      }
    } catch(err){
      statusEl.textContent = 'Network error — please try again in a moment.';
      statusEl.className = 'status error';
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save our RSVP';
  });
</script>
</body>
</html>
